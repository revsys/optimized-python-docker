resources:
  -
    name: busybox
    type: registry-image
    source:
      repository: busybox
  -
    name: oci-build-task
    type: registry-image
    source:
      repository: concourse/oci-build-task
  -
    name: optimized-python-repo
    type: git
    source:
      uri: https://github.com/revsys/optimized-python-docker.git
      branch: concourse

jobs:
  -
    name: python-build
    old_name: the-best-job
    max-in-flight: 1
    plan:
      -
        get: busybox
      -
        get: oci-build-task
      -
        get: optimized-python-repo
        trigger: true
      -
        task: today
        image: busybox
        file: optimized-python-repo/.concourse/tasks/print-date.yml
      -
        task: build
        privileged: true
        image: oci-build-task
        file: optimized-python-repo/.concourse/tasks/build.yml
      -
        task: use-image
        image: python-image
        file: optimized-python-repo/.concourse/tasks/use.yml
