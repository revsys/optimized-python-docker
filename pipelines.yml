
resources:
  -
    name: busybox
    type: registry-image
    source:
      repository: busybox
  -
    name: ci
    type: git
    source: 
      uri: https://github.com/revsys/optimized-python-docker.git
      branch: concourse

jobs:
  -
    name: the-best-job
    plan:
      - get: busybox
      - get: ci
      - task: today
        image: busybox
        file: ci/.concourse/tasks/print-date.yml
