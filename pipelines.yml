
resources:
  -
    name: busybox
    type: registry-image
    source:
      repository: busybox
  -
    name: oci-build-task
    type: registry-image
    source:
      repository: concourse/oci-build-task
  -
    name: ci
    type: git
    source: 
      uri: https://github.com/revsys/optimized-python-docker.git
      branch: concourse

jobs:
  -
    name: the-best-job
    plan:
      - get: busybox
      - get: oci-build-task
      - get: ci
      - task: today
        image: busybox
        file: ci/.concourse/tasks/print-date.yml
      - task: build
        privileged: true
        image: oci-build-task
        file: ci/.concourse/tasks/build.yml
    
