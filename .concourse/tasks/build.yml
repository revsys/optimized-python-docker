# whee

platform: linux

inputs:
  - name: optimized-python-repo

outputs:
  - name: image

caches:
  - path: cache

params:
  CONTEXT: optimized-python-repo
  BUILD_ARG_PYTHON_VERSION: 3.14.8
  BUILD_ARG_BUILD_ARGS: ""
  BUILD_ARG_OPTIMAL: 1
  UNPACK_ROOTFS: true
  TARGET: release


run:
  path: build
